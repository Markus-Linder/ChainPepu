[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-readiness"
version = "0.1.0"
description = "Audit-Werkzeug: Wie gut finden und verstehen KI-Agenten eine Website?"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
probe = ["anthropic>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
agent-readiness = "agent_readiness.cli:main"

[tool.setuptools.packages.find]
include = ["agent_readiness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
