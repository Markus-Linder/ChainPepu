<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Verwaltung · ser7</title>
  <link rel="icon" href="/favicon.svg" />
  <link rel="stylesheet" href="/world/pages.css?v=1" />
</head>
<body>
<div class="wrap wide">
  <header class="top">
    <a class="brand" href="/">ser<span>7</span></a>
    <nav class="links"><a href="/">Zur Suche</a><a href="/verwaltung/" aria-current="page">Verwaltung</a></nav>
  </header>

  <section class="panel" id="login">
    <h1>Verwaltung</h1>
    <p class="lead">Hier gibst du eingetragene Webseiten, Videos und gebuchte Sponsorplätze frei.</p>
    <form id="lf" style="margin-top:16px;max-width:420px">
      <label>Passwort <input id="pw" type="password" autocomplete="current-password" required /></label>
      <div id="lmsg" class="msg bad" hidden></div>
      <div><button type="submit">Anmelden</button></div>
    </form>
  </section>

  <div id="app" hidden style="display:grid;gap:18px">
    <section class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
        <h1 style="margin:0">Verwaltung</h1>
        <div class="seg" role="radiogroup" aria-label="Anzeige">
          <label><input type="radio" name="flt" value="open" checked /><span>Zu prüfen</span></label>
          <label><input type="radio" name="flt" value="all" /><span>Alle</span></label>
        </div>
      </div>
      <div class="stats" style="margin-top:16px">
        <div class="stat"><b id="st-pending">0</b><span>Einträge zu prüfen</span></div>
        <div class="stat"><b id="st-review">0</b><span>Anzeigen zu prüfen</span></div>
        <div class="stat"><b id="st-approved">0</b><span>Einträge online</span></div>
        <div class="stat"><b id="st-active">0</b><span>Anzeigen aktiv</span></div>
        <div class="stat"><b id="st-revenue">0 €</b><span>Umsatz bezahlt</span></div>
      </div>
    </section>
    <section class="panel">
      <h2>Gebuchte Sponsorplätze</h2>
      <div class="list" id="campaigns"></div>
    </section>
    <section class="panel">
      <h2>Eingetragene Webseiten und Videos</h2>
      <div class="list" id="listings"></div>
    </section>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
let pw = '';
try { pw = sessionStorage.getItem('ser7-admin') || ''; } catch {}
const eur = (c) => (c / 100).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const PILL = { pending: ['warn', 'Zu prüfen'], approved: ['ok', 'Online'], rejected: ['bad', 'Abgelehnt'], unpaid: ['warn', 'Unbezahlt'], review: ['warn', 'Bezahlt · zu prüfen'], active: ['ok', 'Aktiv'] };
const pill = (s) => { const [k, t] = PILL[s] || ['warn', s]; return `<span class="pill ${k}">${t}</span>`; };
function checkText(raw) {
  try { const c = JSON.parse(raw); if (!c.reasons?.length) return '<span class="pill ok">Vorprüfung unauffällig</span>';
    return `<span class="pill ${c.verdict === 'reject' ? 'bad' : 'warn'}">Vorprüfung: ${esc(c.reasons.join(', '))}</span>`; } catch { return ''; }
}
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'content-type': 'application/json', 'x-admin-password': pw, ...(opts.headers || {}) } });
  if (r.status === 401) { logout('Falsches Passwort oder Passwort noch nicht eingerichtet.'); throw new Error('401'); }
  return r.json();
}
function logout(text) { pw = ''; try { sessionStorage.removeItem('ser7-admin'); } catch {} $('app').hidden = true; $('login').hidden = false; if (text) { $('lmsg').hidden = false; $('lmsg').textContent = text; } }
async function load() {
  const filter = document.querySelector('input[name=flt]:checked').value;
  const j = await api('/api/admin/list?filter=' + filter);
  $('login').hidden = true; $('app').hidden = false;
  const s = j.stats || {};
  $('st-pending').textContent = s.pending ?? 0; $('st-review').textContent = s.review ?? 0;
  $('st-approved').textContent = s.approved ?? 0; $('st-active').textContent = s.active ?? 0; $('st-revenue').textContent = eur(s.revenue ?? 0);
  $('campaigns').innerHTML = j.campaigns.length ? j.campaigns.map((c) => `
    <div class="item">
      <div>${pill(c.status)} ${checkText(c.check_result)}</div>
      <b>${esc(c.headline)}</b>
      <div class="meta"><a href="${esc(c.url)}" target="_blank" rel="noopener" style="color:inherit">${esc(c.url)}</a></div>
      <div>${esc(c.description)}</div>
      <div class="meta">Suchwörter: ${esc(c.keywords)}${c.promo ? ' · Aktion: ' + esc(c.promo) : ''} · ${c.days} Tage · ${eur(c.price_cents)} · ${esc(c.email)}</div>
      <div class="meta">${c.impressions} Einblendungen · ${c.clicks} Besuche${c.ends_at ? ' · läuft bis ' + new Date(c.ends_at).toLocaleDateString('de-DE') : ''}</div>
      <div class="actions">
        ${c.status === 'review' ? `<button data-t="campaign" data-id="${c.id}" data-a="approve">Freigeben und starten</button>` : ''}
        ${c.status !== 'rejected' ? `<button class="danger" data-t="campaign" data-id="${c.id}" data-a="reject">Ablehnen</button>` : ''}
      </div>
    </div>`).join('') : '<p class="muted">Nichts zu tun.</p>';
  $('listings').innerHTML = j.listings.length ? j.listings.map((l) => `
    <div class="item">
      <div>${pill(l.status)} <span class="pill ok">${l.kind === 'video' ? 'Video' : 'Webseite'}</span> ${checkText(l.check_result)}</div>
      <b>${esc(l.title)}</b>
      <div class="meta"><a href="${esc(l.url)}" target="_blank" rel="noopener" style="color:inherit">${esc(l.url)}</a></div>
      <div>${esc(l.description)}</div>
      <div class="meta">Suchwörter: ${esc(l.keywords) || '–'}${l.promo ? ' · Aktion: ' + esc(l.promo) + (l.promo_until ? ' bis ' + esc(l.promo_until) : '') : ''}${l.email ? ' · ' + esc(l.email) : ''} · ${esc(l.created_at)}</div>
      <div class="actions">
        ${l.status !== 'approved' ? `<button data-t="listing" data-id="${l.id}" data-a="approve">Freigeben</button>` : ''}
        ${l.status !== 'rejected' ? `<button class="danger" data-t="listing" data-id="${l.id}" data-a="reject">Ablehnen</button>` : ''}
      </div>
    </div>`).join('') : '<p class="muted">Nichts zu tun.</p>';
}
document.addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-a]');
  if (!b) return;
  b.disabled = true;
  try { const j = await api('/api/admin/review', { method: 'POST', body: JSON.stringify({ type: b.dataset.t, id: Number(b.dataset.id), action: b.dataset.a }) });
    if (j.error) alert(j.error); else if (j.note) { const n = document.createElement('div'); n.className = 'msg info'; n.textContent = j.note; b.closest('.item').append(n); }
    await load(); } catch {}
});
document.addEventListener('change', (e) => { if (e.target.name === 'flt') load().catch(() => {}); });
$('lf').addEventListener('submit', (e) => { e.preventDefault(); pw = $('pw').value; try { sessionStorage.setItem('ser7-admin', pw); } catch {} $('lmsg').hidden = true; load().catch(() => {}); });
if (pw) load().catch(() => {});
</script>
</body>
</html>
